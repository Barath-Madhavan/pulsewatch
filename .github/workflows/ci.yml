name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulsewatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pulsewatch_test?sslmode=disable

    defaults:
      run:
        working-directory: pulsewatch-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: pulsewatch-backend/go.sum

      - name: Apply migrations to the test database
        run: |
          for f in migrations/*.sql; do
            echo "applying $f"
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go test (unit + integration, with coverage)
        run: |
          pkgs=$(go list ./... | grep -v /mocks)
          coverpkg=$(echo "$pkgs" | tr '\n' ',' | sed 's/,$//')
          go test $pkgs -coverprofile=coverage.out -coverpkg="$coverpkg" -timeout 120s
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: pulsewatch-backend/coverage.out

  frontend:
    name: Frontend (Vite + React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pulsewatch-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pulsewatch-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
